version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: designlens-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: designlens
    volumes:
      - designlens_pgdata:/var/lib/postgresql/data

volumes:
  designlens_pgdata:
